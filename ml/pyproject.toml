[project]
name = "hirelens-ai"
version = "1.0.0"
description = "HireLens AI microservice: resume parsing, job skill extraction, semantic matching, feedback and interview questions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "qdrant-client>=1.12",
    "numpy>=2.0",
    "anthropic>=2.0",
    "openai>=3.0",
    "google-genai>=1.0",
    "httpx2>=2.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Heavy ML models. Not installed in CI / default image; selected by env var at runtime.
ml = [
    "sentence-transformers>=3.0",
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["docx.*", "qdrant_client.*", "google.*", "sentence_transformers.*", "spacy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["app/embeddings/sentence_transformer.py", "app/nlp/spacy_ner.py"]
